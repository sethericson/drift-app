html{background:#1B1910}
[hidden]{display:none!important}

/* Layout: one centered column on a single warm-charcoal ground. Everything is moulded from that ground with a
   light source at the top left: raised shapes for things you press, inset wells for things that hold something
   (the input, the checkbox, the vessel, the calendar tubes). Honey yellow is the only accent and marks what is live. */
:root{
  --base:#1B1910; --surf-a:#221F14; --surf-b:#161409;
  --hi:#34301F; --lo:#0B0A05;
  --honey:#FFD60A; --honey-hi:#FFE766; --honey-lo:#F0B400;
  --cream:#F7F1D6; --mute:#B0A885; --on-honey:#0B0A06;
  --raise:9px 9px 20px var(--lo),-9px -9px 20px var(--hi);
  --raise-sm:5px 5px 12px var(--lo),-5px -5px 12px var(--hi);
  --raise-xs:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);
  --well:inset 7px 7px 14px var(--lo),inset -7px -7px 14px var(--hi);
  --well-sm:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);
  --well-xs:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi);
  --glow:0 0 22px rgba(255,214,10,.30);
  --display:'Unbounded','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.45,.5,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--base); color:var(--cream);
  font-family:var(--body); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased;
  padding-block:30px 140px;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--honey);outline-offset:4px}
p{margin:0}

/* ambient liquid glow, kept to the top-left to match the light source */
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);background:radial-gradient(circle,var(--honey) 0%,rgba(255,214,10,0) 70%);will-change:transform}
.glow .b1{width:min(70vw,560px);height:min(70vw,560px);top:-22%;left:-20%;opacity:.13;animation:drift1 28s ease-in-out infinite alternate}
.glow .b2{width:min(60vw,480px);height:min(60vw,480px);bottom:-16%;right:-18%;opacity:.07;animation:drift2 34s ease-in-out infinite alternate}
.glow .b3{width:min(40vw,320px);height:min(40vw,320px);top:44%;left:40%;opacity:.04;animation:drift3 40s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(16vw,14vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-18vw,-12vh) scale(1.2)}}
@keyframes drift3{to{transform:translate(-18vw,-14vh) scale(.8)}}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto}
#v-today:not([hidden]),#v-cal:not([hidden]){animation:viewin .6s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}}

/* today header */
.top{display:flex;align-items:center;gap:18px}
.dnum{font-family:var(--display);font-weight:800;font-size:clamp(64px,19vw,96px);line-height:.95;letter-spacing:-.04em;color:var(--honey);font-variant-numeric:tabular-nums;text-shadow:0 0 36px rgba(255,214,10,.28)}
.dmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dweek{font-family:var(--display);font-weight:700;font-size:clamp(14px,4vw,17px);letter-spacing:.02em}
.dmon{color:var(--mute);font-size:15px;font-weight:500}

.vbezel{flex:none;width:clamp(80px,23vw,100px);aspect-ratio:1;padding:9px;border-radius:50%;background:linear-gradient(145deg,var(--surf-a),var(--surf-b));box-shadow:var(--raise-sm)}
.vwell{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--base)}
.vwell::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:inset 6px 6px 12px rgba(0,0,0,.62),inset -5px -5px 10px rgba(255,255,255,.07)}
.vessel{display:block;width:100%;height:100%}
.v-level{transition:transform 1.5s var(--ease)}
.v-w1{animation:wave 5s linear infinite}
.v-w2{animation:wave 8s linear infinite reverse}
@keyframes wave{to{transform:translateX(-100px)}}

.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 6px 26px}
.sum{font-size:16px;font-weight:600}
.sum b{color:var(--honey);font-weight:700}
.pct{font-size:14px;color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums}

/* add: an inset well with a raised honey button */
.add{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 26px;background:var(--base);border-radius:999px;box-shadow:var(--well);transition:box-shadow .4s var(--ease)}
.add:focus-within{box-shadow:var(--well),0 0 0 2px rgba(255,214,10,.7),0 0 32px rgba(255,214,10,.22)}
.add input{flex:1;min-width:0;height:46px;background:none;border:0;outline:0;color:var(--cream);font:inherit;font-size:17px}
.add input::placeholder{color:var(--mute)}
.add #addbtn{flex:none;width:50px;height:50px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:linear-gradient(145deg,var(--honey-hi),var(--honey-lo));color:var(--on-honey);box-shadow:var(--raise-xs),var(--glow);transition:transform .45s var(--spring),box-shadow .3s,background .3s,color .3s}
.add #addbtn svg{width:20px;height:20px;transition:transform .5s var(--spring)}
.add #addbtn:hover:not(:disabled) svg{transform:rotate(90deg)}
.add #addbtn:active:not(:disabled){transform:scale(.93);box-shadow:inset 3px 3px 8px rgba(130,85,0,.55),inset -3px -3px 8px rgba(255,240,160,.45)}
.add #addbtn:disabled{background:linear-gradient(145deg,var(--surf-a),var(--surf-b));color:var(--mute);box-shadow:var(--raise-xs);cursor:default}

.sample{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 22px;padding:9px 9px 9px 22px;border-radius:999px;background:var(--base);box-shadow:var(--well-sm);color:var(--mute);font-size:14px}
.sample button{flex:none;border:0;border-radius:999px;background:linear-gradient(145deg,var(--honey-hi),var(--honey-lo));color:var(--on-honey);font-weight:700;font-size:14px;padding:9px 18px;cursor:pointer;box-shadow:var(--raise-xs);transition:transform .35s var(--spring)}
.sample button:hover{transform:scale(1.05)}
.sample button:active{transform:scale(.95)}

/* list: soft raised cards. The shell carries padding so shadows are not clipped while a row collapses. */
.list{list-style:none;margin:24px 0 0;padding:0}
.row{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s var(--ease),opacity .4s,transform .55s var(--ease)}
.row.enter{animation:enter .65s var(--ease) backwards}
@keyframes enter{from{grid-template-rows:0fr;opacity:0;transform:translateY(-14px) scale(.97)}to{grid-template-rows:1fr;opacity:1;transform:none}}
.shell{overflow:hidden;min-height:0;padding:16px 18px 22px;margin:-16px -18px -22px}
.card{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:16px 12px 16px 16px;border-radius:32px;background:linear-gradient(145deg,var(--surf-a),var(--surf-b));box-shadow:var(--raise-sm);transition:filter .3s}
.card:hover{filter:brightness(1.07)}
.body{flex:1;min-width:0}
.text{font-size:17px;font-weight:500;line-height:1.3;overflow-wrap:anywhere;transition:color .4s}
.chip{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:999px;background:var(--base);box-shadow:var(--well-xs);color:var(--honey);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.check{flex:none;position:relative;width:36px;height:36px;padding:0;border-radius:50%;border:0;background:var(--base);box-shadow:var(--well-sm);display:grid;place-items:center;overflow:hidden;cursor:pointer;transition:transform .4s var(--spring),box-shadow .35s}
.check:hover{transform:scale(1.07)}
.check:active{transform:scale(.92)}
.check-fill{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,var(--honey-hi),var(--honey) 55%,var(--honey-lo));transform:scale(0);transition:transform .4s var(--spring)}
.check:hover .check-fill{transform:scale(.34)}
.check svg{position:relative;width:20px;height:20px;fill:none;stroke:var(--on-honey);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .32s .12s var(--ease)}
.del{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer;transition:color .2s,box-shadow .25s,transform .35s var(--spring)}
.del:hover{color:var(--cream);box-shadow:var(--raise-xs)}
.del:active{transform:scale(.92);box-shadow:var(--well-xs)}
.del svg{width:16px;height:16px}
.row.leaving{grid-template-rows:0fr;opacity:0;transform:translateX(30px) scale(.97);transition:grid-template-rows .55s .5s var(--ease),opacity .3s .55s,transform .55s .5s var(--ease)}
.row.leaving .check{box-shadow:var(--raise-xs),var(--glow)}
.row.leaving .check-fill{transform:scale(1)}
.row.leaving .check svg{stroke-dashoffset:0}
.row.leaving .text{color:var(--mute)}
.row.gone{grid-template-rows:0fr;opacity:0;transform:translateX(-30px) scale(.97);transition:grid-template-rows .5s .05s var(--ease),opacity .25s,transform .5s var(--ease)}

.clear{text-align:center;padding:46px 12px 12px;color:var(--mute)}
.clear h2{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--cream)}
.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--mute)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:12px;margin:0 2px 26px}
.cal-title{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:700;font-size:clamp(18px,5vw,26px);letter-spacing:-.01em}
.round,.pill{flex:none;border:0;cursor:pointer;background:linear-gradient(145deg,var(--surf-a),var(--surf-b));box-shadow:var(--raise-xs);transition:box-shadow .25s,transform .4s var(--spring),color .2s}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.pill{height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px}
.round:hover,.pill:hover{color:var(--honey)}
.round:active,.pill:active{transform:scale(.94);box-shadow:var(--well-xs)}
.round svg{width:18px;height:18px}

.calpanel{padding:20px 12px 14px;border-radius:38px;background:linear-gradient(145deg,var(--surf-a),var(--surf-b));box-shadow:var(--raise)}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{margin-bottom:8px}
.dow span{text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.day{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:4px 0 6px;border:0;background:none;cursor:pointer}
.dn{min-width:26px;height:26px;padding:0 5px;line-height:26px;text-align:center;border-radius:999px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;transition:color .2s}
.day:hover .dn{color:var(--honey)}
.day.is-today .dn{background:linear-gradient(145deg,var(--honey-hi),var(--honey-lo));color:var(--on-honey);font-weight:700;box-shadow:var(--raise-xs)}
.day.future{opacity:.42}
.tube{position:relative;width:100%;max-width:54px;height:clamp(40px,11.5vw,54px);border-radius:18px;background:var(--base);overflow:hidden;transition:box-shadow .35s var(--ease)}
.tube::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 4px 4px 9px rgba(0,0,0,.6),inset -4px -4px 8px rgba(255,255,255,.07)}
.day[aria-pressed="true"] .tube{box-shadow:0 0 0 2px rgba(255,214,10,.75),0 0 22px rgba(255,214,10,.3)}
.fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*1%);background:linear-gradient(180deg,var(--honey-hi),var(--honey-lo));animation:rise 1s var(--ease) backwards;animation-delay:calc(var(--i)*14ms)}
.fill::before{content:"";position:absolute;left:-12%;right:-12%;top:-3px;height:8px;border-radius:50%;background:var(--honey-hi)}
.fill.zero{height:3px;background:rgba(255,214,10,.3)}
.fill.zero::before{display:none}
@keyframes rise{from{height:0}}

.detail{margin-top:30px;padding:26px 24px 16px;border-radius:38px;background:linear-gradient(145deg,var(--surf-a),var(--surf-b));box-shadow:var(--raise)}
.d-label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--mute)}
.tag{padding:3px 11px;border-radius:999px;background:linear-gradient(145deg,var(--honey-hi),var(--honey-lo));color:var(--on-honey);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;box-shadow:var(--raise-xs)}
.d-main{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:12px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(48px,14vw,68px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;font-weight:700;margin-left:3px;color:var(--honey)}
.d-sub{font-size:16px;font-weight:600}
.bar{position:relative;height:18px;margin:20px 0 10px;border-radius:999px;background:var(--base);box-shadow:var(--well-sm)}
.bar i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)*var(--p)/100);border-radius:999px;background:linear-gradient(90deg,var(--honey-lo),var(--honey-hi));box-shadow:0 0 14px rgba(255,214,10,.4);animation:grow 1s var(--ease) backwards}
@keyframes grow{from{width:0}}
.dl h3{margin:24px 0 6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dl ul{list-style:none;margin:0;padding:0}
.dl li{display:flex;align-items:center;gap:14px;padding:9px 0}
.dl .t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.dl .n{flex:none;font-size:12px;color:var(--mute);font-weight:600}
.dl .dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.dl .fin .dot{background:linear-gradient(145deg,var(--honey-hi),var(--honey-lo));box-shadow:var(--raise-xs)}
.dl .fin .dot svg{width:14px;height:14px;fill:none;stroke:var(--on-honey);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.dl .open .dot{background:var(--base);box-shadow:var(--well-xs)}
.dl .open .t{color:var(--mute)}
.muted{margin:14px 0 8px;color:var(--mute);font-size:14px}

/* dock: an inset trough with a raised honey thumb */
.dock{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;padding:7px;width:min(272px,calc(100vw - 36px));border-radius:999px;background:var(--base);box-shadow:var(--well-sm),0 16px 36px rgba(0,0,0,.45)}
.thumb{position:absolute;top:7px;bottom:7px;left:7px;width:calc(50% - 7px);border-radius:999px;background:linear-gradient(145deg,var(--honey-hi),var(--honey-lo));box-shadow:var(--raise-xs),var(--glow);transition:transform .6s var(--spring)}
.dock[data-v="cal"] .thumb{transform:translateX(100%)}
.dock button{position:relative;z-index:1;height:46px;border:0;border-radius:999px;background:none;font-weight:700;font-size:15px;cursor:pointer;color:var(--cream);transition:color .3s}
.dock button[aria-selected="true"]{color:var(--on-honey)}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 36px);display:flex;align-items:center;gap:14px;padding:9px 9px 9px 22px;border-radius:999px;background:linear-gradient(145deg,var(--surf-a),var(--surf-b));box-shadow:var(--raise-sm),0 18px 40px rgba(0,0,0,.5);font-size:15px;font-weight:600;opacity:0;pointer-events:none;transform:translate(-50%,16px) scale(.96);transition:opacity .3s,transform .5s var(--spring)}
.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;border:0;border-radius:999px;background:linear-gradient(145deg,var(--honey-hi),var(--honey-lo));color:var(--on-honey);font-weight:700;font-size:14px;padding:9px 18px;cursor:pointer;box-shadow:var(--raise-xs)}

.rep{flex:none;height:40px;padding:0 15px 0 12px;border:0;border-radius:999px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13px;color:var(--mute);background:linear-gradient(145deg,var(--surf-a),var(--surf-b));box-shadow:var(--raise-xs);transition:box-shadow .3s var(--ease),color .25s,background .3s,transform .4s var(--spring)}
.rep svg{width:15px;height:15px;transition:transform .5s var(--spring)}
.rep:hover{color:var(--cream)}
.rep:active{transform:scale(.94)}
.rep[aria-pressed="true"]{color:var(--honey);background:var(--base);box-shadow:var(--well-xs),0 0 0 1.5px rgba(255,214,10,.55),0 0 16px rgba(255,214,10,.22)}
.rep[aria-pressed="true"] svg{transform:rotate(180deg)}
.add{padding-right:7px}
@media (max-width:380px){.rep{padding:0 11px}.rep svg{display:none}}
.row{position:relative}
.row.drag{z-index:15}
.row.drag .shell{overflow:visible}
.row.drag .card{box-shadow:var(--raise),0 0 0 1.5px rgba(255,214,10,.65),0 0 30px rgba(255,214,10,.3);filter:brightness(1.1)}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html.dragging,html.dragging *{-webkit-user-select:none;user-select:none;cursor:grabbing!important;overscroll-behavior:none}
.hint{margin-top:2px;text-align:center;font-size:13px;color:var(--mute)}
.days.still .fill{animation:none}
.dl .xdel{flex:none;width:40px;height:40px;margin:-6px -6px -6px 0;border:0;border-radius:50%;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer;transition:color .2s,box-shadow .25s,transform .35s var(--spring)}
.dl .xdel:hover{color:var(--cream);box-shadow:var(--raise-xs)}
.dl .xdel:active{transform:scale(.92);box-shadow:var(--well-xs)}
.dl .xdel svg{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
}

</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="vclip"><circle cx="50" cy="50" r="50"/></clipPath>
    <linearGradient id="vgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE766"/><stop offset="1" stop-color="#F0B400"/></linearGradient>
  </defs>
</svg>

<main class="app">
  <section id="v-today" aria-label="Today">
    <header class="top">
      <div class="dnum" id="dnum"></div>
      <div class="dmeta"><div class="dweek" id="dweek"></div><div class="dmon" id="dmon"></div></div>
      <div class="vbezel"><div class="vwell"><svg class="vessel" viewBox="0 0 100 100" role="img" aria-label="Today's progress">
        <g clip-path="url(#vclip)">
          <g class="v-level" id="vlevel" style="transform:translateY(106px)">
            <path class="v-w2" d="M-100 10 Q-75 18 -50 10 T0 10 T50 10 T100 10 T150 10 T200 10 V160 H-100Z" fill="#FFD60A" fill-opacity=".45"/>
            <path class="v-w1" d="M-100 8 Q-75 0 -50 8 T0 8 T50 8 T100 8 T150 8 T200 8 V160 H-100Z" fill="url(#vgrad)"/>
          </g>
        </g>
        <path d="M19 36Q23 23 38 16" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-linecap="round"/>
      </svg></div></div>
    </header>
    <div class="sumrow"><p class="sum" id="sum"></p><p class="pct" id="pct"></p></div>

    <div class="sample" id="sample" hidden><span>Sample data so you can see it in motion.</span><button type="button" id="fresh">Start fresh</button></div>

    <form class="add" id="addform" autocomplete="off">
      <input id="newtask" type="text" maxlength="140" placeholder="What needs doing?" aria-label="New task" enterkeyhint="done">
      <button type="button" class="rep" id="repbtn" aria-pressed="false" aria-label="Repeat every day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>Daily</button>
      <button type="submit" id="addbtn" aria-label="Add task" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>

    <ul class="list" id="list"></ul>
    <p class="hint" id="hint" hidden>Tap and hold a task, then drag to reorder</p>
    <div class="clear" id="clear" hidden><h2>All clear.</h2><p>Nothing left for today. Add something above.</p></div>
    <p class="foot" id="foot"></p>
  </section>

  <section id="v-cal" aria-label="Calendar" hidden>
    <div class="cal-head">
      <h1 class="cal-title" id="caltitle"></h1>
      <button class="pill" type="button" id="calnow">Today</button>
      <button class="round" type="button" id="calprev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="round" type="button" id="calnext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="calpanel">
    <div class="dow" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="days" id="days"></div>
    </div>
    <div class="detail dl" id="detail" aria-live="polite"></div>
  </section>
</main>

<nav class="dock" id="dock" data-v="today" role="tablist" aria-label="Views">
  <span class="thumb" aria-hidden="true"></span>
  <button type="button" role="tab" data-v="today" aria-selected="true">Today</button>
  <button type="button" role="tab" data-v="cal" aria-selected="false">Calendar</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastmsg"></span><button type="button" id="toastundo">Undo</button></div>

<script>
/* Drift. Copyright (c) Seth Ericson / Ericson Interactive. All rights reserved. Do not copy. */
(function () {
  'use strict';

  /* ---------- dates ---------- */
  const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MO = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MOS = MO.map(m => m.slice(0, 3));
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
  const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
  const todayStr = () => fmt(new Date());
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const short = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

  /* ---------- state ----------
     task: { o:manual position | null (set when you drag to reorder), i:id, t:text, c:created day, s:order, x:day finished | null, r:day removed | null, k:daily template id | null }
     recur: daily templates { i, t, lm:last day instances were ensured, end:day stopped | null }
     A task is on the list of every day from c until the day it is finished (or the day before it is removed),
     so unfinished work rolls forward by itself and sorts first because it is older.
     hist: archived per-day totals for very old tasks { 'YYYY-MM-DD': { t, d } } */
  const LS_KEY = 'drift.v1';
  const emptyState = () => ({ v: 1, seq: 1, tasks: [], hist: {}, recur: [], demo: false, updatedAt: 0 });

  function normalize(raw) {

  let S = emptyState();
  let TODAY = todayStr();

  let calY = 0, calM = 0, sel = TODAY;

  const byAge = (a, b) => a.c < b.c ? -1 : a.c > b.c ? 1 : a.s - b.s;

    const h = S.hist[D];

  function compact() {

  /* ---------- daily tasks ----------

     so a missed daily never piles up duplicates. Ids are template+day, so every device makes identical copies. */
  function materialize() {
    if (!S.recur.length) return false;
    const have = new Set(S.tasks.map(t => t.i));
    let changed = false;
    for (const r of S.recur) {
      if (r.end) continue;
      let d = r.lm;
      while (d < TODAY) {
        d = addDays(d, 1);
        const open = S.tasks.some(t => t.k === r.i && !t.x && !t.r);
        const id = r.i + '_' + d;
        if (!open && !have.has(id)) { S.tasks.push({ i: id, t: r.t, c: d, s: S.seq++, x: null, r: null, k: r.i }); have.add(id); changed = true; }
      }

  /* ---------- sample data ---------- */
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function makeDemo() {
    const rnd = mulberry32(2718);
    const pool = ['Study for chem quiz', 'Email Coach', 'Laundry', 'Read 20 pages', 'Stretch for 10 min', 'Pack gym bag', 'Water the plants', 'Finish history outline', 'Text Sam back', 'Clean desk', 'Practice session', 'Refill prescription', 'Plan the weekend', 'Call Grandma', 'Charge headphones', 'Math problem set', 'Take out the trash', 'Sign the permission slip'];
    const s = emptyState(); s.demo = true;
    const add = (c, text, x) => s.tasks.push({ i: uid() + s.seq, t: text, c, s: s.seq++, x, r: null });
    for (let off = -26; off <= -1; off++) {
      const c = addDays(TODAY, off);
      if (rnd() < 0.1) continue;
      const n = 2 + Math.floor(rnd() * 4);
      const p0 = 0.25 + rnd() * 0.75;
      for (let k = 0; k < n; k++) {
        const text = pool[Math.floor(rnd() * pool.length)];
        const r = rnd();
        const lag = r < p0 ? 0 : (r < p0 + (1 - p0) * 0.5 ? 1 : (r < p0 + (1 - p0) * 0.8 ? 2 : 3));
        let x = addDays(c, lag);
        if (x > TODAY) x = null;
        add(c, text, x);
      }
    }
    s.recur = [{ i: 'rd1', t: 'Morning stretch', lm: TODAY, end: null }, { i: 'rd2', t: 'Read 20 pages', lm: TODAY, end: null }];
    const inst = (k, text, d, x) => s.tasks.push({ i: k + '_' + d, t: text, c: d, s: s.seq++, x, r: null, k });
    for (let off = -26; off <= 0; off++) {
      const d = addDays(TODAY, off);
      inst('rd1', 'Morning stretch', d, rnd() < 0.85 ? d : (off < 0 ? addDays(d, 1) : null));
      if (off === -1) inst('rd2', 'Read 20 pages', d, null);
      else if (off === 0) { /* carried copy from yesterday stands in for today */ }
      else inst('rd2', 'Read 20 pages', d, rnd() < 0.7 ? d : addDays(d, 1));

    add(TODAY, 'Text Sam back', null);
    add(TODAY, 'Pack gym bag', null);
    return s;
  }

  /* ---------- save: this device always, plus the account when the page can sync ---------- */

  function makeRow(t, delay) {

    li.innerHTML = '<div class="shell"><div class="card">' +

      '<div class="body"><div class="text"></div><span class="chip" hidden></span></div>' +

  function renderHeader() {

    $('#dmon').textContent = MO[d.getMonth()] + ' ' + d.getFullYear();
    const st = dayStats(TODAY), open = activeNow();
    const carried = open.filter(t => t.c < TODAY).length;
    let sum;
    if (open.length) sum = '<b>' + open.length + '</b> to do' + (carried ? ' · <b>' + carried + '</b> carried over' : '');
    else sum = st.total ? 'All done for today' : 'Nothing on the list';

    $('#pct').textContent = st.total ? st.pct + '% · ' + st.done + ' of ' + st.total + ' done' : 'No tasks yet';

  }
  function renderFoot() {

  }
  function refresh() { renderHeader(); renderList(); if (view === 'cal') renderCal(true); renderFoot(); }

  function toast(msg, undo) {

  }
  $('#toastundo').addEventListener('click', () => { const f = toastUndo; toastUndo = null; $('#toast').classList.remove('show'); if (f) f(); });

  function complete(id) {

    const el = rowEls.get(id);

  }
  function removeTask(id) {
    const t = S.tasks.find(x => x.i === id); if (!t || t.x || t.r) return;
    const el = rowEls.get(id);
    if (el) { el.classList.add('gone'); el._t = setTimeout(() => { el.remove(); rowEls.delete(id); }, 700); }
    const tpl = t.k ? S.recur.find(r => r.i === t.k) : null;
    mutate(() => { t.r = TODAY; if (tpl) tpl.end = TODAY; });
    refresh();
    toast((tpl ? 'Stopped daily: ' : 'Removed: ') + short(t.t, 22), () => { mutate(() => { t.r = null; if (tpl) tpl.end = null; }); refresh(); });
  }
  list.addEventListener('click', e => {
    const li = e.target.closest('.row'); if (!li) return;

  const input = $('#newtask'), addbtn = $('#addbtn'), repBtn = $('#repbtn');
  repBtn.addEventListener('click', () => { repBtn.setAttribute('aria-pressed', String(repBtn.getAttribute('aria-pressed') !== 'true')); input.focus(); });
  input.addEventListener('input', () => { addbtn.disabled = !input.value.trim(); });
  $('#addform').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim().slice(0, 140); if (!text) return;
    refreshToday();
    const daily = repBtn.getAttribute('aria-pressed') === 'true';
    mutate(() => {

        const rid = 'r' + uid();
        S.recur.push({ i: rid, t: text, lm: TODAY, end: null });
        S.tasks.push({ i: rid + '_' + TODAY, t: text, c: TODAY, s: S.seq++, x: null, r: null, k: rid });
      } else S.tasks.push({ i: uid(), t: text, c: TODAY, s: S.seq++, x: null, r: null });

    refresh(); input.focus();
  });
  $('#fresh').addEventListener('click', () => {
    mutate(() => { S.tasks = []; S.hist = {}; S.recur = []; S.demo = false; S.seq = 1; });
    rowEls.forEach(el => el.remove()); rowEls.clear();

  });

  /* ---------- tap and hold to reorder ---------- */
  const HOLD_MS = 360;

  let hintSeen = false; try { hintSeen = localStorage.getItem('drift.hint') === '1'; } catch (e) { /* ignore */ }

  function persistOrder() {

  /* ---------- calendar view ---------- */
  function renderCal(still) {

    const dim = new Date(calY, calM + 1, 0).getDate();
    let h = '';
    for (let i = 0; i < lead; i++) h += '<span></span>';

      const ds = calY + '-' + pad(calM + 1) + '-' + pad(d);

  function renderDetail() {
    const D = sel, future = D > TODAY, isToday = D === TODAY;

    const tasks = future ? [] : S.tasks.filter(t => isActiveOn(t, D)).sort(byAge);
    const fin = tasks.filter(t => t.x === D), open = tasks.filter(t => t.x !== D);
    const dt = parse(D);
    const nextDay = WD[parse(addDays(D, 1)).getDay()].slice(0, 3);
    const check = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.5"/></svg>';
    let h = '<div class="d-label">' + WD[dt.getDay()] + ', ' + MO[dt.getMonth()] + ' ' + dt.getDate() + (isToday ? '<span class="tag">Today</span>' : '') + '</div>';
    h += '<div class="d-main"><div class="big">' + (st.total ? st.pct + '<small>%</small>' : '–') + '</div><div class="d-sub">' +
      (st.total ? st.done + ' of ' + st.total + ' finished' : (future ? 'Nothing planned yet' : 'Nothing was on the list')) + '</div></div>';
    h += '<div class="bar" aria-hidden="true"><i style="--p:' + st.pct + '"></i></div>';
    if (fin.length) h += '<h3>Finished · ' + fin.length + '</h3><ul>' + fin.map(t => '<li class="fin"><span class="dot">' + check + '</span><span class="t">' + esc(t.t) + '</span><button type="button" class="xdel" data-id="' + esc(t.i) + '" aria-label="Delete finished task: ' + esc(t.t) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>').join('') + '</ul>';
    if (open.length) h += '<h3>' + (isToday ? 'Still to do' : 'Not finished') + ' · ' + open.length + '</h3><ul>' +
      open.map(t => '<li class="open"><span class="dot"></span><span class="t">' + esc(t.t) + '</span>' + (isToday ? '' : '<span class="n">Moved to ' + nextDay + '</span>') + '</li>').join('') + '</ul>';
    if (!tasks.length && st.total) h += '<p class="muted">The task details for this day are archived. The totals above still count.</p>';
    $('#detail').innerHTML = h;
  }
  $('#detail').addEventListener('click', e => {
    const b = e.target.closest('.xdel'); if (!b) return;
    const idx = S.tasks.findIndex(x => x.i === b.dataset.id);
    if (idx < 0 || !S.tasks[idx].x) return;
    const t = S.tasks[idx];
    mutate(() => { S.tasks.splice(idx, 1); });
    refresh();
    toast('Deleted: ' + short(t.t, 24), () => { mutate(() => { S.tasks.push(t); }); refresh(); });
  });
  $('#days').addEventListener('click', e => {
    const b = e.target.closest('.day'); if (!b) return;
    sel = b.dataset.d;
    document.querySelectorAll('#days .day').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderDetail();
  });
  function goMonth(delta) {
    const d = new Date(calY, calM + delta, 1, 12);
    calY = d.getFullYear(); calM = d.getMonth();
    const cur = parse(TODAY);
    sel = (calY === cur.getFullYear() && calM === cur.getMonth()) ? TODAY : calY + '-' + pad(calM + 1) + '-01';
    renderCal();
  }
  $('#calprev').addEventListener('click', () => goMonth(-1));
  $('#calnext').addEventListener('click', () => goMonth(1));
  $('#calnow').addEventListener('click', () => { const c = parse(TODAY); calY = c.getFullYear(); calM = c.getMonth(); sel = TODAY; renderCal(); });

  /* ---------- dock ---------- */
  function setView(v) {
    view = v;
    $('#dock').dataset.v = v;
    document.querySelectorAll('#dock button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === v)));
    $('#v-today').hidden = v !== 'today';
    $('#v-cal').hidden = v !== 'cal';
    if (v === 'cal') { const c = parse(TODAY); calY = c.getFullYear(); calM = c.getMonth(); sel = TODAY; renderCal(); }
    window.scrollTo(0, 0);
  }
  $('#dock').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });

  /* ---------- day rollover ---------- */
  function refreshToday() {
    const t = todayStr();
    if (t === TODAY) return;
    const old = TODAY; TODAY = t;
    ensureRecurring();
    if (sel === old) { sel = TODAY; }
    if (view === 'cal') { const c = parse(sel); calY = c.getFullYear(); calM = c.getMonth(); }
    renderAll();
  }
  setInterval(refreshToday, 15000);

  /* ---------- reload every hour (waits while something is being typed) ---------- */
  async function hourlyReload() {
    if (input.value.trim() || drag) { setTimeout(hourlyReload, 120000); return; }
    try { if (docRef && S.updatedAt > 0) await flush(); } catch (e) { /* local copy is already saved */ }
    try { location.reload(); } catch (e) { refreshToday(); }
  }
  setInterval(hourlyReload, 3600000);

  /* ---------- boot ---------- */
  (async function boot() {
    const saved = lsLoad();
    if (saved) S = normalize(saved);
    const c = parse(TODAY); calY = c.getFullYear(); calM = c.getMonth();
    if (compact()) { S.updatedAt = Date.now(); lsSave(); }
    ensureRecurring();
    renderAll();
    const adopted = await initSync();
    if (!saved && !adopted && S.updatedAt === 0 && S.tasks.length === 0) { S = makeDemo(); renderAll(); }
    renderFoot();
  })();
})();
</script>
</body>
</html>
